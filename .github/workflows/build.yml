name: ChessPlugin Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Maven yerel deposunu onbellekle
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: BuildTools ile Spigot 26.2 API'sini indir ve kur
        run: |
          mkdir -p buildtools && cd buildtools
          curl -o BuildTools.jar -L https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 26.2 --compile-if-changed

      - name: Eklentiyi derle (mvn clean package)
        run: mvn -B clean package

      - name: Derlenen jar dosyasini yukle (indirilebilir cikti)
        uses: actions/upload-artifact@v4
        with:
          name: ChessPlugin-jar
          path: target/ChessPlugin.jar
